version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: travelplanner_db
    environment:
      POSTGRES_USER: traveluser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword}
      POSTGRES_DB: travelplanner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traveluser -d travelplanner"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travelplanner_network

  # Flask Web Application Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelplanner_web
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_APP: wsgi.py
      DATABASE_URL: postgresql://traveluser:${DB_PASSWORD:-securepassword}@postgres:5432/travelplanner
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      WEATHER_API_BASE_URL: https://api.openweathermap.org/data/2.5/weather
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/__pycache__
    command: >
      sh -c "
        flask db upgrade &&
        python -c 'from app import create_app, db; app = create_app(); app.app_context().push(); db.create_all()' &&
        gunicorn --bind 0.0.0.0:5000 --workers 2 --reload wsgi:app
      "
    networks:
      - travelplanner_network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: travelplanner_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - travelplanner_network

volumes:
  postgres_data:
    driver: local

networks:
  travelplanner_network:
    driver: bridge
