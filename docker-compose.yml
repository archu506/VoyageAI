version: '3.8'

services:
  web:
    build: .
    container_name: smart_tourism
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=True
      - SECRET_KEY=dev-secret-key-change-in-production
      - DATABASE_URL=sqlite:///instance/smart_tourism.db
      - WEATHER_API_KEY=${WEATHER_API_KEY}
    volumes:
      - .:/app
      - /app/instance
    command: python run.py

